<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Emoji favicon — no SVG file needed -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary Meta -->
    <title>CineAI — AI-Powered Movie Recommendations</title>
    <meta name="description" content="CineAI uses AI and content-based filtering to recommend movies you'll love. Search 5,000+ titles, explore cast & details, and save your favorites." />
    <meta name="keywords" content="movie recommendations, AI movies, film discovery, CineAI, TMDB" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CineAI — AI-Powered Movie Recommendations" />
    <meta property="og:description" content="Discover your next favorite movie. AI-powered recommendations from 5,000+ titles." />
    <meta property="og:site_name" content="CineAI" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CineAI — AI Movie Recommendations" />
    <meta name="twitter:description" content="Discover your next favorite movie with AI-powered recommendations." />

    <!-- Google Fonts — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
